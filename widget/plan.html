<button id="obPlanBtn" class="obTopBtn" title="Estimate a prompt before you send it">Plan</button>

<div id="obPlanOv" style="position:fixed;inset:0;z-index:200;display:none;background:rgba(5,4,9,0.86);align-items:center;justify-content:center;padding:16px;-webkit-app-region:no-drag;">
  <div style="width:340px;max-width:96%;max-height:calc(100vh - 32px);overflow-y:auto;font-family:Poppins,sans-serif;background:#17151f;border:0.5px solid rgba(255,255,255,0.13);border-radius:14px;padding:15px;box-shadow:0 18px 55px rgba(0,0,0,0.6);">
    <div style="font-size:12px;color:#bdbbc8;margin-bottom:9px;">Paste your prompt — Obol prices the next turn before you send it.</div>
    <textarea id="obPlanText" placeholder="Paste or type the prompt you're about to send…" rows="4"
      style="width:100%;resize:vertical;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.15);border-radius:9px;color:#efedf6;font-family:Poppins,sans-serif;font-size:12.5px;line-height:1.5;padding:9px 10px;outline:none;"></textarea>

    <div id="obPlanOut" style="margin-top:12px;display:none;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px;">
        <span style="font-size:11px;color:#928f9d;letter-spacing:0.03em;">ESTIMATED COST OF THIS TURN</span>
        <span id="obPlanRec" style="font-size:12px;font-weight:600;"></span>
      </div>
      <div id="obPlanRounds" style="font-size:10.5px;color:#76737f;margin-bottom:9px;"></div>
      <div id="obPlanModels" style="margin-bottom:12px;"></div>
      <div id="obPlanModeHdr" style="font-size:11px;color:#928f9d;letter-spacing:0.03em;margin-bottom:6px;">BY MODE</div>
      <div id="obPlanModes" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px;"></div>
      <div id="obPlanWhy" style="font-size:11.5px;color:#bdbbc8;line-height:1.5;margin-bottom:11px;"></div>
      <div id="obPlanSplit" style="margin-bottom:11px;"></div>
      <div id="obPlanFactors" style="margin-bottom:10px;"></div>
      <div id="obPlanTips" style="margin-bottom:11px;"></div>
      <div id="obPlanBreak" style="font-size:10.5px;color:#76737f;margin-bottom:4px;"></div>
      <div style="font-size:10px;color:#67646f;margin-bottom:12px;">Estimate · official per-model rates, priced for today</div>
      <div style="display:flex;gap:6px;">
        <button id="obPlanApply" style="flex:1;">Use suggested mode</button>
        <button id="obPlanClose" style="width:auto;padding:0 14px;">Close</button>
      </div>
    </div>
    <div id="obPlanEmpty" style="margin-top:12px;display:flex;gap:6px;justify-content:flex-end;">
      <button id="obPlanClose2" style="width:auto;padding:0 14px;">Close</button>
    </div>
  </div>
</div>

<style>
#obPlanApply,#obPlanClose,#obPlanClose2{font-family:Poppins,sans-serif;font-size:12px;font-weight:500;height:34px;border:0.5px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.04);color:#efedf6;border-radius:8px;cursor:pointer;}
#obPlanApply:hover,#obPlanClose:hover,#obPlanClose2:hover{background:rgba(255,255,255,0.09);}
#obPlanText:focus{border-color:rgba(255,255,255,0.35);}
#obPlanOv > div::-webkit-scrollbar{width:8px;}
#obPlanOv > div::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.16);border-radius:4px;}
.obSplit{display:flex;justify-content:space-between;font-size:11.5px;color:#bdbbc8;padding:3px 0;}
.obSplit b{color:#efedf6;font-weight:600;}
.obSplit.tot{border-top:0.5px solid rgba(255,255,255,0.12);margin-top:5px;padding-top:6px;font-size:12.5px;}
.obPill{background:rgba(255,255,255,0.05);border-radius:9px;padding:8px 9px;text-align:center;}
.obPill .k{font-size:10.5px;color:#928f9d;}
.obPill .v{font-size:14px;font-weight:600;margin-top:1px;}
.obPill.best{border:0.5px solid rgba(53,212,155,0.5);background:rgba(53,212,155,0.10);}
.obRow{margin-bottom:8px;}
.obRow.mine .obName{color:#fff;}
.obRowTop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.obName{font-size:12.5px;font-weight:500;color:#cbc9d6;}
.obCost{font-size:12.5px;font-weight:600;color:#efedf6;font-variant-numeric:tabular-nums;}
.obTag{font-size:9.5px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;margin-left:6px;padding:1.5px 5px;border-radius:4px;background:rgba(255,255,255,0.10);color:#bdbbc8;}
.obTag.best{background:rgba(53,212,155,0.16);color:#35d49b;}
.obTag.intro{background:rgba(46,155,255,0.16);color:#7cc0ff;}
.obBar{height:3px;background:rgba(255,255,255,0.06);border-radius:2px;margin-top:4px;overflow:hidden;}
.obBar i{display:block;height:100%;}
.obChip{display:inline-block;font-size:10.5px;color:#ffca6b;background:rgba(255,180,60,0.10);border:0.5px solid rgba(255,180,60,0.28);border-radius:6px;padding:3px 7px;margin:0 5px 5px 0;}
.obTip{display:flex;gap:7px;font-size:11.5px;color:#bdbbc8;line-height:1.5;margin-bottom:7px;}
.obTip b{color:#efedf6;font-weight:600;}
.obTip .d{color:#ffca6b;flex:0 0 auto;}
</style>

<script>
(function(){
  var MODE_COLOR={careful:"#35d49b",balanced:"#2e9bff",aggressive:"#e040fb"};
  var last=null, t=null;
  function ipc(){ try{ return require("electron").ipcRenderer; }catch(e){ return null; } }
  function money(n){
    n = Number(n) || 0;
    if (n > 0 && n < 0.01) return "under 1c";
    return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  /* A range only helps if the ends actually differ once rounded to cents. */
  function moneyRange(lo, hi){
    lo = Number(lo)||0; hi = Number(hi)||0;
    if (hi < 0.01) return "under 1c";
    if (Math.round(hi*100) - Math.round(lo*100) < 1) return money(hi);
    return money(lo) + " – " + money(hi);
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;"})[c];}); }

  function paint(r){
    last=r;
    document.getElementById("obPlanOut").style.display="block";
    document.getElementById("obPlanEmpty").style.display="none";
    var rec=document.getElementById("obPlanRec");
    rec.textContent="suggests "+r.recommended;
    rec.style.color=MODE_COLOR[r.recommended]||"#fff";

    var rd=document.getElementById("obPlanRounds");
    if(rd) rd.textContent = r.openEnded
      ? "Open-ended ask — one reply, or a build. Range covers both."
      : (r.rounds>1 ? ("Agentic task — about "+r.rounds+" model round trips, context re-sent each time.") : "Single reply, one round trip.");
    var sorted=r.models.slice().sort(function(a,b){return a.cost-b.cost;});
    var max=Math.max.apply(null,sorted.map(function(m){return m.cost;}))||1;
    var cheapest=sorted[0];
    document.getElementById("obPlanModels").innerHTML=sorted.map(function(m){
      var w=Math.max(3,Math.round((m.cost/max)*100));
      var isMine=m.id===r.refModel, isBest=m.id===cheapest.id;
      return '<div class="obRow'+(isMine?" mine":"")+'">'+
        '<div class="obRowTop">'+
          '<span class="obName">'+esc(m.label)+
            (isMine?'<span class="obTag">you</span>':'')+
            (isBest&&!isMine?'<span class="obTag best">cheapest</span>':'')+
            (m.intro?'<span class="obTag intro">intro</span>':'')+
          '</span>'+
          '<span class="obCost">'+moneyRange(m.costLow,m.costHigh)+'</span>'+
        '</div>'+
        '<div class="obBar"><i style="width:'+w+'%;background:'+(isBest?"#35d49b":isMine?"#e040fb":"rgba(255,255,255,0.30)")+'"></i></div>'+
      '</div>';
    }).join("");

    var mh=document.getElementById("obPlanModeHdr");
    if(mh) mh.textContent="BY MODE, ON "+String(r.refLabel||"").toUpperCase();
    var modes=["careful","balanced","aggressive"];
    document.getElementById("obPlanModes").innerHTML=modes.map(function(m){
      var on=m===r.mode;
      return '<div class="obPill" style="'+(on?'border:0.5px solid rgba(255,255,255,0.45);':'')+'"><div class="k" style="color:'+(MODE_COLOR[m])+'">'+m+'</div><div class="v">'+money(r.byMode[m])+'</div></div>';
    }).join("");

    var save=r.byMode.aggressive-r.byMode.careful;
    document.getElementById("obPlanWhy").innerHTML=
      "Obol suggests <b style=\"color:"+(MODE_COLOR[r.recommended])+"\">"+esc(r.recommended)+"</b> — "+esc((r.reasons||[]).join(" · "))+
      (save>=0.01?(". Careful instead of aggressive saves about <b style=\"color:#35d49b\">"+money(save)+"</b> here."):".");
    var mine=r.models.filter(function(m){return m.id===r.refModel;})[0]||r.models[0];
    var ctxShare=(r.contextCost!=null)?r.contextCost:0;
    var promptShare=Math.max(0,(mine?mine.cost:0)-ctxShare);
    document.getElementById("obPlanSplit").innerHTML=
      '<div class="obSplit"><span>Your conversation so far ('+(r.rounds>1?(r.rounds+" round trips"):"1 round trip")+')</span><b>'+money(ctxShare)+'</b></div>'+
      '<div class="obSplit"><span>This prompt and its reply</span><b>'+money(promptShare)+'</b></div>'+
      '<div class="obSplit tot"><span>Estimated total on '+esc(r.refLabel||"")+'</span><b>'+moneyRange(mine?mine.costLow:0,mine?mine.costHigh:0)+'</b></div>';
    var fx=r.factors||[], tips=[];
    document.getElementById("obPlanFactors").innerHTML = fx.length
      ? '<div style="font-size:11px;color:#928f9d;letter-spacing:0.03em;margin-bottom:6px;">WHAT IS DRIVING THE COST</div>' +
        fx.map(function(f){ return '<span class="obChip">'+esc(f.label)+' ~'+f.tokens.toLocaleString()+' tok</span>'; }).join("")
      : "";
    fx.forEach(function(f){ if(f.tip) tips.push(f.tip); });
    (r.habits||[]).forEach(function(h){ if(h.tip) tips.push(h.tip); });
    document.getElementById("obPlanTips").innerHTML = tips.length
      ? tips.slice(0,3).map(function(x){ return '<div class="obTip"><span class="d">→</span><span>'+esc(x)+'</span></div>'; }).join("")
      : "";
    function k(n){ n=Number(n)||0; return n>=1000 ? (Math.round(n/100)/10)+"k" : String(Math.round(n)); }
    document.getElementById("obPlanBreak").textContent=
      "prompt "+k(r.promptTokens)+" · context "+k(r.contextTokens)+" (cached) · reply ~"+k(r.outputTokens)+" tokens";
  }

  function ask(){
    var txt=document.getElementById("obPlanText").value||"";
    if(!txt.trim()){ document.getElementById("obPlanOut").style.display="none"; document.getElementById("obPlanEmpty").style.display="flex"; return; }
    var i=ipc(); if(!i) return;
    i.invoke("obol-estimate",txt).then(function(r){ if(r) paint(r); }).catch(function(){});
  }

  var b=document.getElementById("obPlanBtn");
  if(b) b.onclick=function(){ document.getElementById("obPlanOv").style.display="flex"; setTimeout(function(){document.getElementById("obPlanText").focus();},40); ask(); };
  function close(){ document.getElementById("obPlanOv").style.display="none"; }
  var c1=document.getElementById("obPlanClose"), c2=document.getElementById("obPlanClose2");
  if(c1)c1.onclick=close; if(c2)c2.onclick=close;
  var ta=document.getElementById("obPlanText");
  if(ta) ta.addEventListener("input",function(){ clearTimeout(t); t=setTimeout(ask,220); });
  var ap=document.getElementById("obPlanApply");
  if(ap) ap.onclick=function(){ if(last&&window.__obolSetMode){ window.__obolSetMode(last.recommended); ap.textContent="Applied ✓"; setTimeout(function(){ap.textContent="Use suggested mode";},1400);} };
})();
</script>
